<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rota-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131C2E" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <radialGradient id="rota-glow" cx="380" cy="110" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rota-leg" x1="230" y1="265" x2="346" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE9A" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#rota-bg)" />
  <rect width="512" height="512" rx="116" fill="url(#rota-glow)" />
  <rect
    x="14"
    y="14"
    width="484"
    height="484"
    rx="104"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.10"
    stroke-width="3"
  />

  <!-- Perna da rota em direção ao destino (azul -> esmeralda) -->
  <path
    d="M 244 274 L 344 374"
    fill="none"
    stroke="url(#rota-leg)"
    stroke-width="52"
    stroke-linecap="round"
  />

  <!-- Traço principal em "R" (haste e curva de rota) -->
  <path
    d="M 164 374 L 164 176 C 164 150 184 134 214 134 L 272 134 C 322 134 352 164 352 204 C 352 246 322 274 272 274 L 204 274"
    fill="none"
    stroke="#F8FAFC"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ponto de partida na base da haste -->
  <circle cx="164" cy="374" r="13" fill="#2563EB" />

  <!-- Marcador de destino GPS no fim da rota -->
  <circle cx="344" cy="374" r="11" fill="#0B0F17" />
</svg>
